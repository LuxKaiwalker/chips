# nginx server block for Chips -- see DEPLOYMENT.md "nginx + Cloudflare
# Tunnel" for the full setup (cloudflared ingress config, how this fits
# into a NixOS services.nginx.virtualHosts block).
#
# Sits between Cloudflare Tunnel (cloudflared, which terminates the public
# TLS connection at Cloudflare's edge and forwards here over a plain local
# HTTP connection -- no public-facing socket on this machine at all) and
# the Chips FastAPI backend on 127.0.0.1:8000 (run via scripts/run-prod.sh).
#
# This app has NO authentication of any kind. nginx does not add any
# either -- its job here is purely WebSocket-aware proxying, CORS (since the
# published frontend lives on a different origin), and rate limiting. The
# only secret protecting a game is its 6-digit room code, so the join and
# rejoin paths (the two room-code enumeration oracles) are limited more
# tightly than general traffic, and the app applies its own tighter,
# failure-penalised limits on top -- see backend/app/limits.py.
#
# If you need this reachable from the internet but not by the public, put
# real access control in front of it here (mTLS, Cloudflare Access, or an
# auth_request subrequest). There is nothing in the app to fall back on.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=chips_general:10m rate=10r/s;
# Room create/join/rejoin. Sized for the fact that a whole table shares one
# NAT address here (CF-Connecting-IP collapses every player into one key),
# so these are per-table allowances, not per-player ones. The app enforces
# its own tighter, failure-penalised versions of both -- see
# backend/app/limits.py; these are just the cheap outer edge.
limit_req_zone $binary_remote_addr zone=chips_lookup:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=chips_create:10m rate=10r/m;

# nginx answers a throttled request with 503 by default, which is
# indistinguishable from a real outage and differs from the 429 the app
# itself returns. Make both layers agree.
limit_req_status 429;

server {
    # Plain HTTP on loopback only -- TLS is already terminated by
    # Cloudflare's edge before cloudflared ever forwards the request here.
    # Never expose this listener on a non-loopback interface.
    listen 127.0.0.1:8080;
    # Placeholder hostname -- replace with your own. Use a sibling,
    # single-level subdomain of your frontend's (e.g. frontend
    # chips.example.com, backend chips-api.example.com), not e.g.
    # api.chips.example.com (two levels deep), which Cloudflare's free
    # Universal SSL cert (covers only the zone apex + one wildcard level,
    # *.example.com) doesn't reach. See DEPLOYMENT.md.
    server_name your-chips-api.example.com;

    # cloudflared sets CF-Connecting-IP to the real client IP on every
    # request it forwards. Trusted here because this connection is always
    # local (cloudflared -> nginx over loopback), never a direct
    # internet-facing socket an attacker could spoof the header on.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # No file uploads anywhere in this app -- keep this small.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Makes both plain HTTP (REST) and WebSocket (/ws/*) upgrade requests
    # work through the same proxy_pass -- $connection_upgrade is "close"
    # for ordinary requests and "upgrade" only when the client actually
    # asked for one, via the map{} above.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The Access-Control-Allow-Origin values below are placeholders --
    # replace with your published frontend's real origin (its GitHub Pages
    # URL or custom domain). Keep them literal exact origins rather than a
    # wildcard: this app doesn't set Access-Control-Allow-Credentials (the
    # player token travels in the request body / WS query string, not a
    # cookie), but a wildcard would still let any page drive the API on a
    # visitor's behalf. If you need more than one allowed origin, switch to
    # an nginx map keyed on $http_origin instead of a static add_header.
    #
    # Room creation and the two room-code lookups get their own zones. These
    # are separate `location` blocks rather than one, because `add_header` is
    # not inherited between sibling locations -- every block that can produce
    # a response needs its own CORS headers and OPTIONS short-circuit.
    # Precedence works out: an exact `=` match beats a regex, and a regex
    # beats the `/` prefix, so each request lands in the block intended for
    # it.
    location = /api/rooms {
        limit_req zone=chips_create burst=5 nodelay;

        add_header Access-Control-Allow-Origin "https://your-chips-frontend.example.com" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/rooms/[^/]+/(join|rejoin)$ {
        limit_req zone=chips_lookup burst=20 nodelay;

        add_header Access-Control-Allow-Origin "https://your-chips-frontend.example.com" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=chips_general burst=20 nodelay;

        add_header Access-Control-Allow-Origin "https://your-chips-frontend.example.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
    }
}
